[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "approval-first-agentic-workflow"
version = "0.1.0"
description = "A local, approval-first agentic workflow with a strict tool allowlist and SQLite audit trail."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
approval-agent = "approval_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

