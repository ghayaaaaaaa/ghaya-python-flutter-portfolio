  <g font-family="Consolas, 'Courier New', monospace" font-size="12.5">
    <text x="44" y="98" fill="#617080">01</text><text x="76" y="98" fill="#c792ea">def</text><text x="105" y="98" fill="#82aaff"> start</text><text x="150" y="98" fill="#d6deeb">(self, goal: str) -&gt; tuple[str, list[str]]:</text>
    <text x="44" y="124" fill="#617080">02</text><text x="76" y="124" fill="#d6deeb">    plan: Plan = self.planner.plan(goal)</text>
    <text x="44" y="150" fill="#617080">03</text><text x="76" y="150" fill="#c792ea">    if</text><text x="97" y="150" fill="#d6deeb"> not plan.steps:</text>
    <text x="44" y="176" fill="#617080">04</text><text x="76" y="176" fill="#d6deeb">        raise ValueError(</text><text x="238" y="176" fill="#c3e88d">"The planner returned an empty plan."</text><text x="507" y="176" fill="#d6deeb">)</text>
    <text x="44" y="202" fill="#617080">05</text><text x="76" y="202" fill="#c792ea">    if</text><text x="97" y="202" fill="#d6deeb"> any(step.tool not in TOOL_ALLOWLIST for step in plan.steps):</text>
    <text x="44" y="228" fill="#617080">06</text><text x="76" y="228" fill="#d6deeb">        raise ValueError(</text><text x="238" y="228" fill="#c3e88d">"The plan contains a tool outside the allowlist."</text><text x="585" y="228" fill="#d6deeb">)</text>
    <text x="44" y="254" fill="#617080">07</text><text x="76" y="254" fill="#d6deeb">    run_id = uuid.uuid4().hex[:12]</text>
    <text x="44" y="280" fill="#617080">08</text><text x="76" y="280" fill="#d6deeb">    self.store.create_run(run_id, plan.goal, steps)</text>
    <text x="44" y="306" fill="#617080">09</text><text x="76" y="306" fill="#d6deeb">    self._continue_run(run_id)</text>
  </g>

